<text x="90" y="1007" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Blades: three, pressed recycled-polymer skin over stainless ribs, washable, replaced at the six-monthly lift.</text>
<text x="90" y="1025" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Hub and shaft: stainless; the shaft is the only moving part outside the sealed pod.</text>
<text x="90" y="1043" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Rotor is slow and enclosed within its swept circle by the duct ring (not shown); fish pass around it.</text>
<text x="90" y="1061" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Rated 250 kW at 2.5 m/s with Cp 0.35; blade set is swapped for the local speed band.</text>
