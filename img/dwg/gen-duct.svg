<text x="90" y="985" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="currentColor">Materials / comments:</text>
<text x="90" y="1007" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Shroud: rolled recycled-polymer panels on a stainless ring frame; bolted segments for container shipping.</text>
<text x="90" y="1025" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  The converging inlet raises throat speed about 1.4×, which the cube law turns into roughly 2.7× the power per m² of rotor.</text>
<text x="90" y="1043" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Screen bars keep fish and flotsam out of the blade zone; spacing set with the fisheries regulator during trials.</text>
<text x="90" y="1061" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Duct also carries the unit's lifting points and the clamps for pylon or leg mounting.</text>
