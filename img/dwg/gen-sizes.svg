<text x="640" y="985" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="currentColor">Materials / comments:</text>
<text x="640" y="1007" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Six capacities, one drivetrain family. The 50 kW unit carries the fixed parts over the fewest kilowatts, so it costs most per megawatt.</text>
<text x="640" y="1025" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Swept diameters are planning figures; the 2 MW unit uses four rotors on one shaft line in a steel cradle (see sheet 15).</text>
<text x="640" y="1043" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Power shown is rotor output before gearbox and alternator losses.</text>
