<text x="1120" y="826" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="currentColor">Blades nest; hubs, pods, legs and cable pack in a 40 ft ISO container.</text>
<text x="1120" y="844" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="currentColor">Assembly on site in about four hours with a gantry.</text>
<text x="1120" y="862" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="currentColor">Service depth 5–25 m; river units ≥ 2 m water under walkways.</text>
