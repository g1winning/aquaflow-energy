<text x="90" y="1043" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Cable runs up the pier to a deck cable tray, then to the switchgear shed at the abutment.</text>
<text x="90" y="1061" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Minimum two metres of water under walkways for slung units; five metres of clear water for fully submerged units.</text>
