<text x="90" y="1007" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Spacing about three diameters across the channel and staggered so each unit sees clean water on both tides.</text>
<text x="90" y="1025" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Tide runs about 20 hours in 24; slack water 20 to 30 minutes at each turn, covered by a second entrance or a small battery.</text>
<text x="90" y="1043" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Drift survey by boat sets the layout: a buoy for direction, GPS drift for speed, 100 m in 60 s ≈ 1.7 m/s.</text>
<text x="90" y="1061" font-family="Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="currentColor">–  Units sit below 5 m, clear of the lane; divers service from a workboat every six months.</text>
</svg>
